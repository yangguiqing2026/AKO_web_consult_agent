agent:
  id: "AKO_web_consult_agent"
  name: "Ako Web Consult Agent"
  log_level: "INFO"

# 知识库配置
registry:
  endpoint: "${REGISTRY_ENDPOINT:http://localhost:5024}"
  sync_interval: 60
  timeout: 10

health:
  endpoint: "/health"
  interval: 30

paths:
  logs_dir: "logs"
  output_dir: "output"
